#start:hover{background:linear-gradient(#3a6147,#1a3526);box-shadow:0 0 16px #c9a24a88}

<div id="piano">
 <div class="ui" id="level"></div>
 <div class="ui" id="start">СТАРТ</div>
 <div class="ui" id="msg"></div>
 <div class="ui" id="modes"><button data-m="lock">🔒 Замок</button><button data-m="free">🎹 Свободно</button><button data-m="magic">✨ Магия</button></div>
 <div id="banner">✦ ТАЙНИК ОТКРЫТ ✦</div>
</div>
<script>
const W=1925,H=817,piano=document.getElementById('piano');
const edges=[75,148,228,310,390,472,553,635,718,800,880,962,1043,1125,1208,1290,1370,1450,1532,1612,1693,1775,1850];
const blackAt=new Set([1,2,4,5,6,8,9,10,12,13,14,16,17,18,20,21]); // граница-индекс между белыми
const TOP=215,BOT=645,BBOT=490,BW=50;
const RUNES="ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟᚪᚫᚣᛡᛠᛢᛣᛤᛥᛦᛧᛨᛩᛪ";
const SECRET=[64, 67, 71, 72, 76, 74, 71, 67, 69, 64];
let buf=[],lastT=0;
const keys={}; // midi -> {els:[...]}
let m=60;
const pct=(v,t)=>(v/t*100)+'%';
function mk(cls,x1,x2,y1,y2,midi){
  const hit=document.createElement('div');hit.className='k '+cls;
  Object.assign(hit.style,{left:pct(x1,W),width:pct(x2-x1,W),top:pct(y1,H),height:pct(y2-y1,H)});
  const hl=document.createElement('div');hl.className='hl '+cls;
  hl.style.cssText=hit.style.cssText;
  const rn=document.createElement('span');rn.className='rn';rn.textContent=RUNES[midi-60];hit.append(rn);
  piano.append(hit,hl);keys[midi]={hl};
  hit.addEventListener('pointerdown',e=>{e.preventDefault();press(midi)});
}
const blacks=[];
for(let i=0;i<22;i++){
  mk('w',edges[i],edges[i+1],TOP,BOT,m);
  m++;
  if(blackAt.has(i+1)&&i<21){const c=edges[i+1];blacks.push([c,m]);m++;}
}
blacks.forEach(([c,mi])=>mk('b',c-BW/2,c+BW/2,TOP,BBOT,mi));

let ac;
function tone(midi,dur=.9,vol=1){
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  const f=440*Math.pow(2,(midi-69)/12),t=ac.currentTime;
  const g=ac.createGain();g.connect(ac.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35*vol,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+dur+.4);
  [[1,'triangle',1],[2,'sine',.35],[3,'sine',.12]].forEach(([mul,type,v])=>{
    const o=ac.createOscillator(),og=ac.createGain();o.type=type;o.frequency.value=f*mul;og.gain.value=v;
    o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+.5);
  });
}
function flash(midi,ms=260,bad=false){
  const h=keys[midi].hl;h.classList.toggle('bad',bad);h.classList.add('on');
  setTimeout(()=>h.classList.remove('on'),ms);
}
const $=id=>document.getElementById(id),msg=$('msg'),startBtn=$('start'),banner=$('banner');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const MAX_ERR=3;
const FREE_MSG='Играй свободно… Говорят, одна мелодия из рун открывает дверь';
const LEVELS=[
 {notes:[67,70,69,65,63],gaps:[420,300,520,380,0]},
 {notes:[65,68,67,63,62,60],gaps:[400,300,450,350,300,0]},
 {notes:[67,70,72,73,72,70,67],gaps:[350,300,300,450,300,300,0]},
 {notes:[65,68,70,71,70,68,65,63],gaps:[350,280,300,450,280,300,350,0]},
 {notes:[60,63,65,66,67,70,67,65,63],gaps:[330,280,300,280,450,300,280,320,0]}
];
// магический режим: [ноты (аккорд или одна), пауза после, мс]
const MAGIC=[
 [[62,65,69,72],420],[[81],220],[[79],220],[[77],220],[[76],320],
 [[67,71,74],420],[[74],220],[[77],220],[[79],220],[[83],420],
 [[60,64,67,71],420],[[84],300],[[81],220],[[79],220],[[76],320],
 [[69,72,76],320],[[76],220],[[74],220],[[72],220],[[69,65],900]
];
let lvl=0,errors=0,mode='lock',state='idle',pos=0,run=0,mrun=0;
const cur=()=>LEVELS[lvl];

function plaque(){
  const l=$('level');
  if(mode==='lock')l.innerHTML='Уровень '+(lvl+1)+'<small>'+'♥'.repeat(MAX_ERR-errors)+'♡'.repeat(errors)+'</small>';
  else l.textContent=mode==='free'?'Свободная игра':'Магический режим';
}
function later(fn,ms){const id=run;setTimeout(()=>{if(id===run)fn()},ms);}

async function demo(){
  const id=++run;state='demo';
  msg.textContent='Слушай внимательно…';
  await sleep(600);
  for(let i=0;i<cur().notes.length;i++){
    if(id!==run)return;
    tone(cur().notes[i]);flash(cur().notes[i],450);
    await sleep(cur().gaps[i]+180);
  }
  if(id!==run)return;
  pos=0;state='input';msg.textContent='Твой ход: повтори '+cur().notes.length+' нот';
}
function press(midi){
  if(!keys[midi])return;
  tone(midi);
  if(mode==='free'){
    const t=Date.now();if(t-lastT>6000)buf=[];lastT=t;
    buf.push(midi);buf=buf.slice(-10);flash(midi,200);
    if(buf.length===10&&buf.every((n,i)=>n===SECRET[i])){buf=[];door();}
    return;
  }
  if(mode!=='lock'||state!=='input'){flash(midi,200);return;}
  if(midi===cur().notes[pos]){
    flash(midi,260);pos++;
    msg.textContent='Верно: '+pos+' из '+cur().notes.length;
    if(pos===cur().notes.length)win();
  }else{
    flash(midi,400,true);run++;errors++;
    if(errors>=MAX_ERR){
      state='fail';
      msg.textContent='Три ошибки! Всё сначала — с 1 уровня';
      errors=0;lvl=0;plaque();
      later(demo,2400);
    }else{
      state='fail';plaque();
      msg.textContent='Мимо! Ошибок: '+errors+' из '+MAX_ERR+'. Слушай ещё раз…';
      later(demo,1500);
    }
  }
}
async function win(){
  const id=++run;state='win';
  const done=lvl+1,last=done>=LEVELS.length;
  msg.textContent=last?'✦ ТАЙНИК ОТКРЫТ ✦':'Прекрасно! Уровень '+done+' пройден ✨';
  await sleep(500);
  [67,70,74,77].forEach((n,i)=>setTimeout(()=>{tone(n,1.2);flash(n,500)},i*140));
  if(last){
    [72,76,79,84,88].forEach((n,i)=>setTimeout(()=>{tone(n,1.6);flash(n,600)},900+i*160));
    banner.textContent='✦ ТАЙНИК ОТКРЫТ ✦';banner.classList.add('show');
    startBtn.textContent='ЗАНОВО';
    setTimeout(()=>banner.classList.remove('show'),6000);
    return;
  }
  await sleep(2000);
  if(id!==run)return;
  lvl++;plaque();demo();
}
function door(){
  msg.textContent='✦ ДВЕРЬ ОТКРЫТА ✦';
  banner.textContent='✦ ДВЕРЬ ОТКРЫТА ✦';banner.classList.add('show');
  [48+12,67,72,76,79,84].forEach((n,i)=>setTimeout(()=>{tone(n,1.8,.7);flash(n,700)},500+i*180));
  setTimeout(()=>{banner.classList.remove('show');if(mode==='free')msg.textContent=FREE_MSG;},6000);
}
async function magic(){
  const id=++mrun;startBtn.textContent='СТОП';msg.textContent='Пианино играет само…';
  while(id===mrun){
    for(const [notes,d] of MAGIC){
      if(id!==mrun)return;
      const v=1/Math.sqrt(notes.length);
      notes.forEach(n=>{if(keys[n]){tone(n,1,v);flash(n,380);}});
      await sleep(d);
    }
    await sleep(700);
  }
}
function setMode(m){
  run++;mrun++;mode=m;state='idle';banner.classList.remove('show');
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  startBtn.style.display=m==='free'?'none':'flex';
  if(m==='lock'){lvl=0;errors=0;startBtn.textContent='СТАРТ';msg.textContent='Нажми «Старт». Можно ошибиться '+MAX_ERR+' раза';}
  if(m==='free'){buf=[];msg.textContent=FREE_MSG;}
  if(m==='magic'){startBtn.textContent='ИГРАТЬ';msg.textContent='Нажми «Играть» — пианино сыграет само';}
  plaque();
}
startBtn.addEventListener('click',()=>{
  banner.classList.remove('show');
  if(mode==='lock'){lvl=0;errors=0;plaque();startBtn.textContent='ЗАНОВО';demo();}
  else if(mode==='magic'){
    if(startBtn.textContent==='СТОП'){mrun++;startBtn.textContent='ИГРАТЬ';msg.textContent='Нажми «Играть» — пианино сыграет само';}
    else magic();
  }
});
document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
setMode('lock');
</script></body></html>
